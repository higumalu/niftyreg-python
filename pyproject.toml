[build-system]
requires = [
  "scikit-build-core>=0.12",
  "pybind11>=3.0",
  "numpy>=1.26",
]
build-backend = "scikit_build_core.build"

[project]
name = "niftyreg-python"
version = "0.1.0"
description = "Python/SimpleITK interface for NiftyReg via pybind11"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "SimpleITK>=2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.scikit-build]
wheel.packages = ["python/niftyreg"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
